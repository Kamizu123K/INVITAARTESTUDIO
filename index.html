  <meta property="og:title" content="Invita Arte Studio">

  <meta property="og:image" content="assets/cover.svg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/effects.css">

<body>
  <a class="skip-link" href="#app">Saltar al contenido principal</a>
  <header class="site-header" id="top">
    <div class="container header-wrap">
      <a class="brand" href="#inicio" aria-label="Ir al inicio">
        <img src="assets/logo-invitaarte-studio.png" alt="Invita Arte Studio" class="brand-logo">
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
      <nav class="main-nav" id="mainNav" aria-label="Navegación principal">
        <a href="#inicio" data-nav>Inicio</a>
        <a href="#catalogo" data-nav>Catálogo</a>
        <a href="#cotizador" data-nav>Cotizador</a>
        <a href="#seguimiento" data-nav>Seguimiento</a>
        <a href="#modelo" data-nav>Modelo MVC</a>
        <a href="#panel" class="nav-pill" id="panelLink" data-nav>Mi cuenta</a>

  </header>

  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script src="js/data/seedData.js"></script>
  <script src="js/services/LocalStoreService.js"></script>
