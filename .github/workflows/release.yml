name: Release Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    name: Syntax, tests, build and security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify syntax, tests and build
        run: npm run release:verify

      - name: Verify forbidden files
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files="$(
            git ls-files |
            grep -E '(^|/)\.env$|(^|/)node_modules/|(^|/)dist/|(^|/)runtime-data/|local-api-db\.json$|credentials.*\.json$|service-account.*\.json$' ||
            true
          )"

          if [ -n "$forbidden_files" ]; then
            echo "Forbidden tracked files detected:"
            echo "$forbidden_files"
            exit 1
          fi

          echo "No forbidden local files were found."

            - name: Scan tracked files for possible secrets
        shell: bash
        run: |
          set -euo pipefail

          # Se divide el texto para evitar que el escáner
          # detecte su propia expresión dentro del workflow.
          private_key_pattern='-----BEGIN PRIVATE'' KEY-----'
          supabase_pattern='sb_secret_[A-Za-z0-9_-]{20,}'
          meta_pattern='EAA[A-Za-z0-9]{40,}'

          combined_pattern="${private_key_pattern}|${supabase_pattern}|${meta_pattern}"

          if git grep -n -E -- "$combined_pattern" -- .; then
            echo "A possible secret was detected."
            exit 1
          fi

          echo "No exposed secrets were detected."

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: invita-arte-studio-1.1.0-build
          path: |
            dist/invita-arte-studio-1.1.0
            dist/manifest-1.1.0.json
          if-no-files-found: error
          retention-days: 14